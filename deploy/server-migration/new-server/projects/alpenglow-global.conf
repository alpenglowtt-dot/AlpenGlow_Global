# AlpenGlow's entry for backup-nightly.sh and healthcheck.sh, installed by
# 01-base-setup.sh into ~/ops/projects/. add-project.sh writes the same kind
# of file for every further project.
NAME=alpenglow-global
BACKEND="$HOME/projects/alpenglow-global/backend"
DB_CONTAINER=supabase-db
CONTAINERS="supabase-db supabase-kong supabase-rest supabase-auth supabase-edge-functions supabase-pooler supabase-storage supabase-meta"
DOMAIN=api.alpenglowglobal.com
# Gateway, REST and database together; must answer 200.
PROBE_URL="http://127.0.0.1:8000/rest/v1/packages?select=id&limit=1"
PROBE_KEY_VAR=ANON_KEY
